name: CICD

on:
  push:
    branches: [ main ]
  pull_request:

env:
  DOTNET_NOLOGO: true
  SLN: ${{ github.workspace }}/NQuery.slnx

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # We need the full history in order to use Git versioning
          # The comparison engines under external/, which the differential tests replay queries
          # against.
          submodules: true
      - name: Get .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.*'
      - name: Build the baseline engine
        # OldEngineDifferentialTests binds to this assembly through the "baseline" extern alias
        # and compiles out when it is absent, so it has to exist before the solution builds.
        # Debug regardless of the solution's configuration below: the test project references
        # artifacts/bin/NQuery/debug_net8.0. Building NQuery.Data builds NQuery with it, which is
        # the other half of the alias. The old engine needs no build -- OldEngineDefinitionTests
        # reads its test definitions as files.
        run: dotnet build external/nquery-baseline/src/NQuery.Data -c Debug --nologo
      - name: dotnet build
        run: |
          dotnet build ${env:SLN} -t build -t pack -c Release --nologo
      - name: dotnet test
        run: |
          dotnet test --solution ${env:SLN}
      - name: Upload binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'terrajobst'
        uses: actions/upload-artifact@v7
        with:
          path: artifacts
          name: artifacts
  vscode:
    # Windows rather than Ubuntu: the integration tests launch a real VS Code, which would
    # otherwise need xvfb, and they drive the .NET language server host.
    runs-on: windows-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6
      - name: Get Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Get .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.*'
      - name: Build the language server host
        # The integration tests launch this the same way a user's project file would, so it has
        # to exist before they run.
        run: dotnet build src/NQuery.LanguageServer.Northwind/NQuery.LanguageServer.Northwind.csproj --nologo
      - name: npm ci
        run: npm ci
        working-directory: vscode
      - name: Build extension
        run: npm run compile
        working-directory: vscode
      - name: Unit tests
        run: npm run test:unit
        working-directory: vscode
      - name: Integration tests
        run: npm run test:integration
        working-directory: vscode
      - name: Package extension
        run: npx --yes @vscode/vsce package --out nquery.vsix
        working-directory: vscode
      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          path: vscode/nquery.vsix
          name: vsix

  push-to-github:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'terrajobst'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: artifacts
      - run: |
          dotnet nuget push artifacts/package/release/*.nupkg -s "https://nuget.pkg.github.com/terrajobst/index.json" -k ${{ secrets.GITHUB_TOKEN }}
