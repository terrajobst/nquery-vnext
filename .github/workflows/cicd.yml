name: CICD

on:
  push:
    branches: [ main ]
  pull_request:

env:
  DOTNET_NOLOGO: true
  SLN: ${{ github.workspace }}/NQuery.slnx

jobs:
  # Linux, because everything here is .NET 8: the test projects drop their net481 target off
  # Windows (see the TargetFrameworks condition in NQuery.Tests.csproj), so this covers the whole
  # suite except .NET Framework, which build-framework picks up.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # We need the full history in order to use Git versioning
          # The comparison engines under external/, which the differential tests replay queries
          # against.
          submodules: true
      - name: Get .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.*'
      - name: Build the baseline engine
        # OldEngineDifferentialTests binds to this assembly through the "baseline" extern alias
        # and compiles out when it is absent, so it has to exist before the solution builds.
        # Debug regardless of the solution's configuration below: the test project references
        # artifacts/bin/NQuery/debug_net8.0. Building NQuery.Data builds NQuery with it, which is
        # the other half of the alias. The old engine needs no build -- OldEngineDefinitionTests
        # reads its test definitions as files.
        run: dotnet build external/nquery-baseline/src/NQuery.Data -c Debug --nologo
      - name: dotnet build
        run: dotnet build "$SLN" -t build -t pack -c Release --nologo
      - name: dotnet test
        run: dotnet test --solution "$SLN"
      - name: Upload binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'terrajobst'
        uses: actions/upload-artifact@v7
        with:
          path: artifacts
          name: artifacts

  # The only job that needs Windows: net481 cannot be executed anywhere else. Scoped to the two
  # multi-targeted test projects and to that framework alone, so the .NET 8 suite is not run twice
  # -- the Linux job above already covered it.
  build-framework:
    runs-on: windows-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # We need the full history in order to use Git versioning
      - name: Get .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.*'
      - name: dotnet test (net481)
        # No baseline engine here: NQuery.Tests only references it from its net8.0 target, and
        # compiles the differential tests out when it is absent.
        run: |
          dotnet test --project tests/NQuery.Tests/NQuery.Tests.csproj -f net481
          dotnet test --project tests/NQuery.Authoring.Tests/NQuery.Authoring.Tests.csproj -f net481

  vscode:
    # Linux: npm installs and packaging move thousands of small files, which Windows runners are
    # markedly slower at. The integration tests launch a real VS Code, so they need a display --
    # hence xvfb-run on the one step that starts it.
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v6
      - name: Get Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Get .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.*'
      - name: Build the language server host
        # The integration tests launch this the same way a user's project file would, so it has
        # to exist before they run.
        run: dotnet build src/NQuery.LanguageServer.Northwind/NQuery.LanguageServer.Northwind.csproj --nologo
      - name: npm ci
        run: npm ci
        working-directory: vscode
      - name: Build extension
        run: npm run compile
        working-directory: vscode
      - name: Unit tests
        run: npm run test:unit
        working-directory: vscode
      - name: Integration tests
        # -a picks a free display number rather than failing if :99 is taken.
        run: xvfb-run -a npm run test:integration
        working-directory: vscode
      - name: Package extension
        # Through the script, not npx: vsce is a devDependency, so npm ci pins the version that
        # produces the .vsix instead of picking up whatever is newest at run time.
        run: npm run package
        working-directory: vscode
      - name: Upload extension
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/vscode/*.vsix
          name: vsix

  push-to-github:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner == 'terrajobst'
    # build-framework as well as build: the two together are what the single Windows job used to
    # cover, and a net481 failure has to keep packages from being pushed.
    needs: [build, build-framework]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts
          path: artifacts
      - run: |
          dotnet nuget push artifacts/package/release/*.nupkg -s "https://nuget.pkg.github.com/terrajobst/index.json" -k ${{ secrets.GITHUB_TOKEN }}
